syntax = "proto3";
option csharp_namespace = "nadena.dev.ndmf.proto";

package nadena.dev.ndmf.proto;

import "proto/base_types.proto";

enum ColliderType {
  SPHERE = 0;
  // Capsule along the Y axis
  CAPSULE = 1;
  PLANE = 2;
}

enum DynamicBoneLimitType {
  DYNAMIC_BONE_LIMIT_TYPE_NONE = 0;
  DYNAMIC_BONE_LIMIT_TYPE_ANGLE = 1;
  DYNAMIC_BONE_LIMIT_TYPE_HINGE = 2;
  DYNAMIC_BONE_LIMIT_TYPE_POLAR = 3;
}

message DynamicCollider {
  ObjectID target_transform = 1;
  ColliderType type = 2;
  float radius = 3;
  float height = 4;
  Vector position_offset = 5;
  Quaternion rotation_offset = 6;
}

message DynamicBone {
  optional string template_name = 2;
  optional ObjectID root_transform = 3;
  bool is_grabbable = 5;
  //.bool ignore_self = 6;
  repeated ObjectID colliders = 7;
  
  repeated DynamicBoneNode bones = 8;
  optional float vrc_pull = 20;
  optional float vrc_spring = 21;
  optional float vrc_stiffness = 22;
  optional float vrc_gravity = 23;
  optional float vrc_immobile = 24;
  bool vrc_parameters = 25;
  DynamicBoneLimitType limit_type = 26;
  // VRC branch direction policy: Ignore, First, or Average.
  string multi_child_type = 27;
}

message DynamicBoneNode {
  ObjectID bone = 1;
  float radius = 2;
  optional float pull = 3;
  optional float spring = 4;
  optional float stiffness = 5;
  optional float gravity = 6;
  optional float immobile = 7;
  // Degrees, sampled using VRC's simulated-bone ratio (excluding the final tip).
  optional float max_angle_x = 8;
  optional float max_angle_z = 9;
  // Local offset of the limit frame, using VRC's Euler XYZ order.
  Quaternion limit_rotation = 10;
}
